schema_version: 2
style: notebook-pen-v1
kind: concept
form: comparison
reader_question: 已经看到回复或预览，文件任务就完成了吗？
takeaway: 回复和预览不能替代对实际文件的检查。
source_sections:
- 从预览走到实际位置
- 保存以后，关闭再打开
placement: 从预览走到实际位置
composition: 三个大物件并排：左为非软件化对话气泡，中为双层纸面中的简略缩略页，右为带折角的实体文件纸张。下方分别写reply、preview、file。右侧文件适度加重轮廓作为落点，三者不连箭头，不画从回复自动生成文件的过程。每个两行标签独立占足宽度。
  全系列 notebook-pen-v1：统一不透明细方格纸、黑色中性笔和中性灰。只画作者概念示意，不画软件窗口、菜单、按钮、鼠标或状态灯。图内只出现文字包 title
  与 labels，不把图注、构图指令和风险说明画进图内。所有核心标签至少58px，标题适当放大；对象占主要画幅，保留清楚间距，按358px阅读宽度检查。
content_guard: 不画真实软件窗口或假成功截图；预览中只画短横线，不填写本书案例结果。实际文件也并非天然可编辑，标签表达应执行的核对动作，不表达已通过。仅需聊天解释的任务仍可在回复处完成。
text_roles:
  reply:
    role: author
  preview:
    role: author
  file:
    role: author
structure:
  nodes:
  - reply
  - preview
  - file
  edges: []
analysis:
  source_sha256: 02f92e74805e9781746cbe30c28fd4cfcc4cd658ce4149b3023559511c9bcc8d
  reviewed_by: codex
  checked_on: '2026-10-05'
  reason: 读者可能把AI的完成报告或预览当成交付文件；三种对象并排比文字提醒更容易形成正确完成标准。 本轮公开准备已回读对应小节，图意保持，依据更新后的正文与图注重新制作。
  benefit: 要求文件时能继续找到实际文件，并在目标软件核对打开、编辑和保存。
labels:
  zh-CN: labels.zh-CN.yaml
