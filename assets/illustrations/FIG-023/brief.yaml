schema_version: 2
style: notebook-pen-v1
kind: concept
form: scene
reader_question: 下次继续工作，什么要更新，什么可以沿用？
takeaway: 当期事实、共同规则和表达偏好应分别管理。
source_sections:
- 让新任务取得正确依据
- 项目：保留一项持续工作的共同背景
- 记忆：延续偏好，并检查它是否理解准确
- 把事实、规则和偏好分别管理
placement: 把事实、规则和偏好分别管理
composition: 画三个上下错开、彼此不覆盖的纸质收纳托盘：左上facts，中间rules，右下preferences。每个托盘中只有几张无字纸张，托盘正面是对应两行标签。每一标签周围留白，三对象不连箭头；这是一张桌面信息分类隐喻，不是软件的资料库、项目或记忆界面。画幅主要空间给三个大标签，装饰纸张只占少量。
  全系列 notebook-pen-v1：统一不透明细方格纸、黑色中性笔和中性灰。只画作者概念示意，不画软件窗口、菜单、按钮、鼠标或状态灯。图内只出现文字包 title
  与 labels，不把图注、构图指令和风险说明画进图内。所有核心标签至少58px，标题适当放大；对象占主要画幅，保留清楚间距，按358px阅读宽度检查。
content_guard: 不暗示资料库只存事实、项目只存规则或记忆只存偏好；三种功能可配合且都按需。用当期材料指已核对的有效依据，不代表日期最新的一份自动有效。偏好不能代替业务事实或削弱本次明确交付要求。
text_roles:
  facts:
    role: author
  rules:
    role: author
  preferences:
    role: author
structure:
  nodes:
  - facts
  - rules
  - preferences
  edges: []
analysis:
  source_sha256: f94b8f8f00ff88b45361c02e4d41b0bab858759d177c6a97919f5a628a8618cf
  reviewed_by: codex
  checked_on: '2026-10-05'
  reason: 最常见错误是把本周事实保存成长期背景，或让个人偏好覆盖当次要求；按内容性质分放比机械对应三个功能更有助于接续工作。 本轮公开准备已回读对应小节，图意保持，依据更新后的正文与图注重新制作。
  benefit: 复用稳定方法时更新当期资料，保留规则适用范围，并让表达偏好服从本次交付。
