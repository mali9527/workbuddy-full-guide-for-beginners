  reason: 具体反馈容易被读者理解成再要求优化一次。用通知开头与不变安排的并置，展示修改边界，能把抽象反馈方法落到当前案例。
  benefit: 读者会同时说明改哪里、希望改成什么、哪些事实不动，缩小后续核对范围并减少整篇返工。
