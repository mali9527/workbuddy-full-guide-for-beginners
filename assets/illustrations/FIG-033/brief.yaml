  source_sha256: c187de9ffc44c49a5c0111ce7d3399939acdcf2949b1cb2f764b7468d5287007
  reviewed_by: Codex（office_thinking_edit，正文全文回读与配图研究）
  checked_on: '2026-10-04'
  reason: 事实更正可能只改了表格却留下旧小结，也可能把无关内容全部重写；把核对表与其下游成果连起来，可帮助找到真正影响范围。
  benefit: 一处更正后，沿共同依据检查已存在的三份成果，同时保留未受影响内容，减少遗漏和无效重做。
