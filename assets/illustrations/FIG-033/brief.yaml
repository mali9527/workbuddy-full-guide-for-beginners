schema_version: 2
style: notebook-pen-v1
kind: concept
form: relationship
reader_question: 一处事实更正，应该修改哪些成果？
takeaway: 先改共同依据，再检查引用它的已存在成果；只改受影响内容。
source_sections:
- 用同一份明细生成小结和安排
- 一个状态更正，要沿着它的影响修改
placement: 一个状态更正，要沿着它的影响修改
composition: 五个主要对象。左上“新依据”小纸页指向中间较大的“核对与统计表”；统计表向右上“一页小结”、右下“后续安排”各连一根箭头，形成明显的共同来源。左下独立便笺“未受影响处保留”用细括号同时指示三份成果的保留原则，不画成第四份交付物。新依据与保留便笺面积小于三个成果，所有箭头起终点明确。没有自动同步按钮，不画循环生成所有格式。
  统一 notebook-pen-v1，保留 1448×1086 不透明细方格纸和黑色中性笔。图内只渲染 title 与 labels，不渲染 caption、alt
  或构图说明。所有核心字至少 58 px，优先 62—68 px，主标题 70 px；文字分行时只在语义处换行，不拆数字或词。四周至少留 75 px，按 358
  px 正文宽度检查。
content_guard: 新依据不一定改变每个数字或每个文件，箭头表示需要检查的影响关系，不保证软件自动同步。本例 M04 仍已完成，不能因按期判断改变而把它重新列为待交付；具体数字留正文，不新增统计假设。后续安排须有自己的行动依据，不能仅根据总数编造他人的承诺。保留便笺是作者提醒而非新增成果。
  这是作者对正文方法的概念图，不是软件界面、操作实录或 WorkBuddy 已执行成果；不画按钮、成功回执、夸大效率数字或未经提供的新事实。
