  reason: 同样围绕周报，咨询、讨论和交文件的完成标准不同；三行并列比较能防止把回复已完成等同于实际交付。
  benefit: 读者先认清自己这次要哪一种结果，再用相应标准检查，避免无必要的文件生成或漏掉文件交付。
