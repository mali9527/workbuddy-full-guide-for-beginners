analysis:
  source_sha256: 180c8e7ba74c9d6648bc6a576ec4942a561670a6a3b24c69ca82b8ddfdd8b8ba
  reviewed_by: Codex（office_thinking_edit，正文全文回读与配图研究）
  checked_on: '2026-10-04'
  reason: 通知中缺少事实和句子表达不清，表面都像“写得不好”，却不能用相同的润色指令修好；两条路径适合并排比较。
  benefit: 先判断缺的是事实还是表达，再给 WorkBuddy 对应反馈，减少反复整篇重写与新增无依据承诺。
