  reason: 复用时最隐蔽的错误是把旧成稿当本期事实；分别画出沿用与替换对象，可直接提醒下一次该交什么。
  benefit: 保留下次仍适用的做法，把本期事实、日期范围与样式参考分开，检验留下的是方法而非旧答案。
