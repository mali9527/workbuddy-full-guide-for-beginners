kind: interface
form: detail
reader_question: 默认权限面板里，完全访问开关是什么状态？
takeaway: 练习保留默认权限，完全访问保持关闭。
source_sections:
- 默认权限，不代表每一步都会再问
placement: 默认权限，不代表每一步都会再问
composition: 只放大截图的权限入口及上方已展开面板。下方保留盾牌图标、默认权限文字和向上小箭头；弹出面板在其上方，保留上部说明区、分隔线、下部允许完全访问文字及右侧开关。说明区用三条短横线代替长文字。开关用空心圆角轨道，圆点明确在左侧；作者圈注保持关闭置于面板外右侧，短箭头指开关，不放成菜单项。三条核心labels约55px以上。图内只渲染title与labels，不渲染caption或alt；主面板占纸面大部，不重画整张主页。
content_guard: 真实状态是默认权限且完全访问关闭，不能画成开启，不能增加点击开启的指向。长说明只作线条简化，不编造软件说明文字，也不借此表示默认模式每一步都会询问。省略工作空间、模型、发送、模板和卡通图形；不用完全访问确认弹窗拼接本面板。仅使用固定方格纸黑白中性灰。
