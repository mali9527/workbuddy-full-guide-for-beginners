kind: concept
form: sequence
reader_question: 这份一页周报怎样才算真的做完？
takeaway: 从八条记录做到可检查的周报，再核对修订文件里的实际结果。
source_sections:
- 把原材料复制到练习位置
- 照着交代一次，不必先背提示词
- 先核对事实，再看文字顺不顺
- 只改一处，保留其他内容
- 找到文件，关闭后再打开
placement: 把原材料复制到练习位置
composition: 五个主对象按练习路线排成两排：上排从左到右八条记录、一页周报、对照原记录；从右侧向下，到下排右侧限定一处修改，再向左到重开看修订稿。只画这四条顺序箭头，不添加循环箭头或按钮。八条记录用一叠两张纸表示，不密画八个小条目；一页周报用一张纸，核对处画一支小笔，修订稿仍是一张可读纸页而非聊天气泡。五项文字都在纸片内或紧邻纸片，不增加日期、文件名、分类标签或勾选结果。
  所有核心标签至少58px，只有title和labels可以写入图内，不画caption、alt、编号、图例或额外小字。固定notebook-pen-v1方格纸与黑色中性笔，只用黑白中性灰；不画软件窗口、菜单或仿真按钮。
content_guard: 这是本书虚构八条记录练习的路线，不是WorkBuddy实测截图或保证生成成功。首稿不必有错误，限定一处修改可只是有目的的表达调整；不能暗示所有任务都必须改两轮。图中纸页不代表已经存在文件，仍需按正文找到并检查实际结果。不要把下周计划画成本周成果。
