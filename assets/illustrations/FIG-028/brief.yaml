  reason: 相同交付单号既可能是副本，也可能是更新或冲突；三个并列情形能防止把“去重”理解成统一删行。
  benefit: 遇到重复编号时，先识别记录关系，再分别计数、更新状态或保留待核，保留历史与来源。
