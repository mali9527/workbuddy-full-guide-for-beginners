name: Check publication

on:
  pull_request:
  push:

env:
  # Verification dates follow the authoring calendar.
  TZ: Asia/Tokyo

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install local check dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Initialize local generated-file manifest
        run: python tools/studio.py --root . --json build
      - name: Confirm tracked publication files are unchanged
        run: git diff --exit-code
      - name: Check source and publication evidence
        run: python tools/studio.py --root . --json check --publication
